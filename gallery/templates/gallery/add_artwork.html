{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dodaj pracek</title>
    <link rel="stylesheet" href="{% static 'gallery/style.css' %}?v=1">
    <style>
        .form-container {
	max-width: 600px;
	margin: 40px auto;
	padding: 20px;
	background: white;
	border-radius: 8px;
	box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
}

.form-group {
	margin-bottom: 15px;
}

.form-group label {
	display: block;
	margin-bottom: 5px;
	font-weight: bold;
}

.form-group input,
.form-group select {
	width: 100%;
	padding: 8px;
	border: 1px solid #ccc;
	border-radius: 4px;
}

.errorlist {
	color: #e74c3c;
	list-style-type: none;
	padding: 0;
	margin: 5px 0 0 0;
	font-size: 14px;
	font-weight: bold;
}

.non-field-errors {
	background: #fdfaef;
	border-left: 4px solid #e74c3c;
	padding: 10px;
	margin-bottom: 20px;
	color: #e74c3c;
	font-weight: bold;
}
    </style>
</head>
<body style="background: #f4f4f9;">

    <div class="form-container">
        <h2>Dodaj nowa prace</h2>
        
        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}
            
            {% if form.non_field_errors %}
                <div class="non-field-errors">
                    {{ form.non_field_errors }}
                </div>
            {% endif %}

            {% for field in form %}
                <div class="form-group">
                    <label>{{ field.label }}</label>
                    {{ field }}
                    {{ field.errors }}
                </div>
            {% endfor %}

            <div style="margin-top: 20px; display: flex; gap: 10px;">
                <button type="submit" style="background: #2ecc71; color: white; border: none; padding: 10px 20px; border-radius: 4px; font-weight: bold; cursor: pointer;">Zapisz prace</button>
                <a href="{% url 'dashboard' %}" style="text-decoration: none; padding: 10px 20px; background: #95a5a6; color: white; border-radius: 4px;">Anuluj</a>
            </div>
        </form>
    </div>

</body>
</html>
