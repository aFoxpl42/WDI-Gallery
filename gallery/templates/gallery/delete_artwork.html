{% load static %}
<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Usuń Pracę</title>
    <link rel="stylesheet" href="{% static 'gallery/style.css' %}?v=3">
</head>
<body>

    <div class="delete-container">
        <h2 style="color: #e74c3c; margin-bottom: 15px;">Potwierdź Usunięcie</h2>
        <p>Czy na pewno chcesz usunąć pracę <strong>"{{ artwork.title }}"</strong> autorstwa <strong>{{ artwork.author }}</strong>?</p>
        <p style="color: #7f8c8d; font-size: 14px; margin-bottom: 30px;">Tej operacji nie można cofnąć.</p>
        
        <form method="post">
            {% csrf_token %}
            <div class="form-actions">
                <button type="submit" class="btn-danger">Tak, Usuń</button>
                <a href="{% url 'dashboard' %}" class="btn-secondary">Anuluj</a>
            </div>
        </form>
    </div>

</body>
</html>
