{% load static %}
<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Edytuj Pracę</title>
    <link rel="stylesheet" href="{% static 'gallery/style.css' %}?v=3">
</head>
<body>

    <div class="form-container">
        <h2>Edytuj Pracę: {{ artwork.title }}</h2>
        
        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}
            
            {% if form.non_field_errors %}
                <div class="non-field-errors">
                    {{ form.non_field_errors }}
                </div>
            {% endif %}

            {% for field in form %}
                <div class="form-group">
                    <label>{{ field.label }}</label>
                    {{ field }}
                    {{ field.errors }}
                </div>
            {% endfor %}

            <div class="form-actions">
                <button type="submit" class="btn-primary">Zapisz Zmiany</button>
                <a href="{% url 'dashboard' %}" class="btn-secondary">Anuluj</a>
            </div>
        </form>
    </div>

</body>
</html>
