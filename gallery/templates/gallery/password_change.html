{% load static %}
<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Zmień Hasło</title>
    <link rel="stylesheet" href="{% static 'gallery/style.css' %}?v=1">
    <style>
        .form-container { max-width: 500px; margin: 80px auto; padding: 30px; background: white; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: bold; color: #2c3e50; }
        .form-group input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; }
        .helptext { font-size: 12px; color: #7f8c8d; display: block; margin-top: 5px; }
        .errorlist { color: #e74c3c; list-style-type: none; padding: 0; margin: 5px 0 0 0; font-size: 14px; font-weight: bold; }
    </style>
</head>
<body style="background: #f4f4f9;">

    <div class="form-container">
        <h2 style="color: #2c3e50; margin-bottom: 20px;">Zmień Hasło</h2>
        
        <form method="post">
            {% csrf_token %}
            
            {% if form.non_field_errors %}
                <div style="background: #fdfaef; border-left: 4px solid #e74c3c; padding: 10px; margin-bottom: 20px; color: #e74c3c; font-weight: bold;">
                    {{ form.non_field_errors }}
                </div>
            {% endif %}

            {% for field in form %}
                <div class="form-group">
                    <label>{{ field.label }}</label>
                    {{ field }}
                    {% if field.help_text %}
                        <span class="helptext">{{ field.help_text|safe }}</span>
                    {% endif %}
                    {{ field.errors }}
                </div>
            {% endfor %}

            <div style="margin-top: 25px; display: flex; gap: 10px;">
                <button type="submit" style="background: #3498db; color: white; border: none; padding: 10px 20px; border-radius: 4px; font-weight: bold; cursor: pointer; width: 100%;">Zmień Hasło</button>
                <a href="{% url 'dashboard' %}" style="text-decoration: none; padding: 10px 20px; background: #95a5a6; color: white; border-radius: 4px; text-align: center; width: 100%;">Anuluj</a>
            </div>
        </form>
    </div>

</body>
</html>
