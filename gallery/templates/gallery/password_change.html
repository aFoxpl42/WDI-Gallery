{% load static %}
<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Zmień Hasło</title>
    <link rel="stylesheet" href="{% static 'gallery/style.css' %}?v=3">
</head>
<body>

    <div class="form-container">
        <h2 style="color: #2c3e50; margin-bottom: 20px;">Zmień Hasło</h2>
        
        <form method="post">
            {% csrf_token %}
            
            {% if form.non_field_errors %}
                <div class="non-field-errors">
                    {{ form.non_field_errors }}
                </div>
            {% endif %}

            {% for field in form %}
                <div class="form-group">
                    <label>{{ field.label }}</label>
                    {{ field }}
                    {% if field.help_text %}
                        <span class="helptext">{{ field.help_text|safe }}</span>
                    {% endif %}
                    {{ field.errors }}
                </div>
            {% endfor %}

            <div class="form-actions">
                <button type="submit" class="btn-primary">Zmień Hasło</button>
                <a href="{% url 'dashboard' %}" class="btn-secondary">Anuluj</a>
            </div>
        </form>
    </div>

</body>
</html>
