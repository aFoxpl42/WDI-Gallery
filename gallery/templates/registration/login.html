{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prowadzacy</title>
    <link rel="stylesheet" href="{% static 'gallery/style.css' %}">
    <style>
        /* A little extra CSS just to center the login box nicely */
        .login-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: #f4f4f9;
        }
        .login-box {
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
        }
        .login-box form p {
            margin-bottom: 15px;
        }
        .login-box input {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <div class="login-wrapper">
        <div class="login-box">
            <h2 style="text-align: center; margin-bottom: 20px;">Prowadzacy</h2>
            
            <form method="POST">
                {% csrf_token %}
                
                {{ form.as_p }}
                
                <button type="submit" class="btn" style="width: 100%; margin-top: 15px;">Logowanie</button>
            </form>
            
            <p style="text-align: center; margin-top: 20px;">
                <a href="{% url 'home_page' %}" style="color: #555; text-decoration: none;">&larr; Wroc do galerii</a>
            </p>
        </div>
    </div>


</body>
</html>
